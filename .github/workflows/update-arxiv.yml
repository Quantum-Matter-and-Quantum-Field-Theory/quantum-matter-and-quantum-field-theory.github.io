
name: Update Scientific Feeds and Deploy Website

on:
  schedule:
    - cron: "17 13 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Update arXiv feed
        run: python3 scripts/fetch_arxiv.py

      - name: Validate arXiv feed
        run: |
          python3 -c "import json; data = json.load(open('arxiv-feed.json', encoding='utf-8')); assert isinstance(data, dict) and data.get('updatedAt') and isinstance(data.get('posts'), list) and data['posts'], 'Empty or invalid arXiv feed'"

      - name: Restore previous YouTube feed
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: youtube-feed.json
          key: youtube-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-feed-v1-

      - name: Update YouTube feed
        id: youtube_update
        continue-on-error: true
        run: |
          python3 scripts/fetch_youtube.py

          python3 -c "import json; data = json.load(open('youtube-feed.json', encoding='utf-8')); assert isinstance(data, dict) and data.get('updatedAt') and isinstance(data.get('posts'), list), 'Invalid YouTube feed'"

      - name: Save YouTube feed
        if: steps.youtube_update.outcome == 'success'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: youtube-feed.json
          key: youtube-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare website
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cp arxiv-feed.json _site/arxiv-feed.json

          if [ -f youtube-feed.json ]; then
            cp youtube-feed.json _site/youtube-feed.json
          fi

          rm -rf _site/.github _site/scripts

      - name: Version local CSS and JavaScript
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          root = Path('_site').resolve()
          version = os.environ['GITHUB_SHA'][:12]
          pattern = re.compile(r"(?P<prefix>\b(?:src|href)\s*=\s*)(?P<quote>['\"])(?P<url>[^'\"]+)(?P=quote)", re.IGNORECASE)
          count = 0

          for page in root.rglob('*.html'):
              def replace(match):
                  global count
                  parts = urlsplit(match.group('url'))
                  if parts.scheme or parts.netloc or not parts.path:
                      return match.group(0)
                  if Path(parts.path).suffix.lower() not in ('.css', '.js'):
                      return match.group(0)
                  asset = (root / parts.path.lstrip('/') if parts.path.startswith('/') else page.parent / parts.path).resolve()
                  if not asset.is_relative_to(root) or not asset.is_file():
                      return match.group(0)
                  query = [(k, v) for k, v in parse_qsl(parts.query, keep_blank_values=True) if k != 'v']
                  query.append(('v', version))
                  url = urlunsplit(('', '', parts.path, urlencode(query), parts.fragment))
                  count += 1
                  return match.group('prefix') + match.group('quote') + url + match.group('quote')

              source = page.read_text(encoding='utf-8')
              updated = pattern.sub(replace, source)
              if updated != source:
                  page.write_text(updated, encoding='utf-8')

          if count == 0:
              raise RuntimeError('No local CSS or JavaScript references were versioned.')
          print(f'Versioned {count} local asset references with {version}.')
          PYTHON

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
