name: Test Scheduled Workflow

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check scheduled execution
        run: |
          echo "Scheduled workflow test"
          echo "Trigger: ${{ github.event_name }}"
          date -u